const LISTS_META = [

  {id:'DEF2',  label:'Difensori 2',          row:1},

  {id:'MID1',  label:'Centrocampisti 1',    row:2},

const OPEN_LISTS_META = [
  {id:'OPEN1', label:'Lista aperta round 1', row:4},
  {id:'OPEN2', label:'Lista aperta round 2', row:4},
  {id:'REPAIR', label:'Asta di riparazione', row:5},

const ROLE_QUOTA = {D:8, C:8, A:4};
// Numero massimo di giocatori che ogni utente può mettere all'asta di
// riparazione (svincolare) senza che siano ancora stati risolti (in attesa
// o già nel listone del round in corso). Una volta risolta una nomina
// (venduta o svincolata definitivamente) non conta più nel limite.
const REPAIR_NOMINATION_LIMIT = 6;
const ROLE_LABEL = {D:'Difensore', C:'Centrocampista', A:'Attaccante', P:'Portiere'};
// Mappa lista a ruolo fisso -> ruolo, per contare quanti D/C/A ha già ciascun utente
const LIST_ROLE = {GK:'P', DEF1:'D', DEF2:'D', DEF3:'D', MID1:'C', MID2:'C', MID3:'C', FWD1:'A', FWD2:'A'};

let state = {
  loading: true,
  currentUser: null,
  view: 'login',
  adminTab: 'utenti',
  users: [],
  config: {initialCredits: 500},
  lists: {},
  submissions: {},
  loginError: '',
  loginAdminMode: false,
  openListId: null,
  prefDraft: null,
  prefErrors: {},
  toast: null,
  squadCompletion: null, // {assigned:{user:[{player,price,role}]}, computedAt}
  manualAssignments: {}, // {user:[{id,player,price,role}]} - assegnazioni manuali admin pre-completamento
  dataAnomaly: null, // array di nomi documento che risultano assenti in modo sospetto (vedi loadAll)
  anomalyBackupTs: null, // timestamp del backup usato per il recupero temporaneo in memoria
  prefImportResult: null, // esito dell'ultimo import di preferenze da file
  finalRosters: null, // {username:[{player,price}]} - fonte di verità rose caricata da admin da file, sostituisce il calcolo automatico
  finalRostersUpdatedAt: null,
  rosterImport: null, // {teams:[{excelName, username, players:[{name,price}]}]} - anteprima import rose in corso, non persistita
  repairListings: [], // [{id, username, player, price, minBid, role, addedAt, resolved, wonBy, finalPrice, returnedUnsold}]
};

function uid(){ return Math.random().toString(36).slice(2,10); }

function defaultLists(){
  const o = {};
  LISTS_META.forEach(m=>{
    o[m.id] = {id:m.id, label:m.label, players:[], openAt:null, closeAt:null, status:'setup', assigned:null, lockedAt:{}};
  });
  OPEN_LISTS_META.forEach(m=>{
    o[m.id] = {id:m.id, label:m.label, players:[], openAt:null, closeAt:null, status:'setup', assigned:null, assignedPlayers:null, lockedAt:{}};
  });
  return o;
}

// ================= IMPORT/EXPORT PREFERENZE =================
// Formato riga: lista;utente;giocatore;offerta (accetta anche virgola o tab).
// "lista" può essere l'ID interno (GK, DEF1...) o l'etichetta visibile (Portieri, Difensori 1...).
// L'ordine delle righe per stesso utente+lista determina l'ordine di preferenza.

function resolveListId(raw){
  if(!raw) return null;
  const s = String(raw).trim().toLowerCase();
  const all = [...LISTS_META, ...OPEN_LISTS_META];
  const byId = all.find(m=>m.id.toLowerCase()===s);
  if(byId) return byId.id;
  const byLabel = all.find(m=>m.label.toLowerCase()===s);
  return byLabel ? byLabel.id : null;
}

function findPlayerInList(list, name){
  const s = String(name||'').trim().toLowerCase();
  return (list.players||[]).find(p=>p.name.trim().toLowerCase()===s) || null;
}

function findUserByName(uname){
  const s = String(uname||'').trim().toLowerCase();
  return state.users.find(u=>u.username.trim().toLowerCase()===s) || null;
}

function parsePrefImportLine(line){
  const parts = line.split(/[;,\t]/).map(s=>s.trim());
  if(parts.length<4) return null;
  return {lista:parts[0], utente:parts[1], giocatore:parts[2], offerta:parts[3]};
}

// Importa preferenze in blocco in state.submissions (NON persiste da solo:
// chi chiama deve poi salvare con persistSubs()/persistLists()).
async function importPreferencesFromText(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const startIdx = /^(lista|list)\b/i.test(lines[0]||'') ? 1 : 0;
  const grouped = {}; // `${listId}__${username}` -> [{player,bid}]
  const errors = [];
  let okCount = 0;
  for(let i=startIdx;i<lines.length;i++){
    const rowNum = i+1;
    const row = parsePrefImportLine(lines[i]);
    if(!row){ errors.push(`Riga ${rowNum}: servono 4 campi (lista;utente;giocatore;offerta).`); continue; }
    const listId = resolveListId(row.lista);
    if(!listId){ errors.push(`Riga ${rowNum}: lista "${row.lista}" non riconosciuta.`); continue; }
    const user = findUserByName(row.utente);
    if(!user){ errors.push(`Riga ${rowNum}: utente "${row.utente}" non trovato.`); continue; }
    const list = state.lists[listId];
    const player = findPlayerInList(list, row.giocatore);
    if(!player){ errors.push(`Riga ${rowNum}: giocatore "${row.giocatore}" non trovato in ${list.label}.`); continue; }
    const bid = parseFloat(String(row.offerta).replace(',','.'));
    if(isNaN(bid) || bid < player.minBid){ errors.push(`Riga ${rowNum}: offerta non valida per ${player.name} (minimo ${player.minBid}).`); continue; }
    const key = listId+'__'+user.username;
    if(!grouped[key]) grouped[key] = [];
    const isFixed = LISTS_META.some(m=>m.id===listId);
    if(isFixed && grouped[key].length>=6){ errors.push(`Riga ${rowNum}: superate le 6 preferenze per ${list.label}/${user.username}, riga ignorata.`); continue; }
    if(grouped[key].some(p=>p.player===player.name)){ errors.push(`Riga ${rowNum}: ${player.name} già inserito per ${user.username} in questa lista.`); continue; }
    grouped[key].push({player: player.name, bid});
    okCount++;
  }
  const usersAffected = new Set();
  Object.keys(grouped).forEach(key=>{
    const sepIdx = key.indexOf('__');
    const listId = key.slice(0,sepIdx), username = key.slice(sepIdx+2);
    usersAffected.add(username);
    if(!state.submissions[listId]) state.submissions[listId] = {};
    state.submissions[listId][username] = grouped[key];
    const list = state.lists[listId];
    if(!list.lockedAt) list.lockedAt = {};
    if(!(username in list.lockedAt)) list.lockedAt[username] = list.openAt || null;
  });
  return {okCount, errors, usersAffected: usersAffected.size};
}

function exportPreferencesCSV(){
  const rows = [['lista','utente','giocatore','offerta']];
  [...LISTS_META, ...OPEN_LISTS_META].forEach(m=>{
    const subs = state.submissions[m.id] || {};
    Object.keys(subs).forEach(username=>{
      (subs[username]||[]).forEach(p=>{ rows.push([m.label, username, p.player, p.bid]); });
    });
  });
  const csv = rows.map(r=>r.map(c=>String(c).replace(/;/g,',')).join(';')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `preferenze_${Date.now()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

const DEFAULT_USERS = [{username:'admin', password:'admin', role:'admin', credits:0}];
const DEFAULT_CONFIG = {initialCredits:500};
const loadedDocs = new Set();
const BACKUP_COLLECTION = 'fantacalcio_backups';
const BACKUP_THROTTLE_MS = 2*60*1000; // massimo un backup automatico ogni 2 minuti
const BACKUP_KEEP = 40; // quanti backup automatici conservare
let lastAutoBackupAt = 0;
let backupsCache = []; // lista backup per la scheda admin "Backup"

function checkFirebaseConfigured(){
  return firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith('INCOLLA_QUI');
}

function snapshotState(){
  return {
    users: state.users,
    config: state.config,
    lists: state.lists,
    submissions: state.submissions,
    squadCompletion: state.squadCompletion,
    manualAssignments: state.manualAssignments,
    finalRosters: state.finalRosters,
    repairListings: state.repairListings,
  };
}

// Recupera l'ultimo backup automatico salvato (se esiste). Usato sia per il
// controllo di sicurezza in fase di caricamento, sia dalla scheda Backup.
async function fetchLatestBackup(){
  try{
    const snap = await db.collection(BACKUP_COLLECTION).orderBy('ts','desc').limit(1).get();
    if(snap.empty) return null;
    return snap.docs[0].data(); // {ts, data:{...}}
  }catch(e){ return null; }
}

async function loadBackupsList(){
  try{
    const snap = await db.collection(BACKUP_COLLECTION).orderBy('ts','desc').limit(25).get();
    backupsCache = snap.docs.map(d=>({id:d.id, ts:d.data().ts}));
  }catch(e){ backupsCache = []; }
}

function formatBackupDate(iso){
  try{ return new Date(iso).toLocaleString('it-IT'); }catch(e){ return iso; }
}

// Salva uno snapshot completo dei dati in una collezione SEPARATA da quella
// principale, così un problema sulla collezione dati non intacca i backup.
// Throttled per non scrivere ad ogni singola modifica.
async function autoBackupIfDue(){
  const now = Date.now();
  if(now - lastAutoBackupAt < BACKUP_THROTTLE_MS) return;
  lastAutoBackupAt = now;
  try{
    const iso = new Date().toISOString();
    await db.collection(BACKUP_COLLECTION).doc(iso).set({ts: iso, data: snapshotState()});
    await pruneOldBackups();
  }catch(e){ /* un backup fallito non deve mai bloccare l'app */ }
}

async function pruneOldBackups(){
  try{
    const snap = await db.collection(BACKUP_COLLECTION).orderBy('ts','desc').get();
    const extra = snap.docs.slice(BACKUP_KEEP);
    if(!extra.length) return;
    const batch = db.batch();
    extra.forEach(d=>batch.delete(d.ref));
    await batch.commit();
  }catch(e){}
}

function flagAnomaly(docName){
  if(!state.dataAnomaly) state.dataAnomaly = [];
  if(!state.dataAnomaly.includes(docName)) state.dataAnomaly.push(docName);
}

async function restoreFromBackupDoc(id){
  const doc = await db.collection(BACKUP_COLLECTION).doc(id).get();
  if(!doc.exists){ showToast('Backup non trovato.'); return; }
  applyBackupData(doc.data().data);
  await persistAllDocs();
  state.dataAnomaly = null;
  showToast('Backup ripristinato e salvato.');
  render();
}

function applyBackupData(data){
  state.users = (data && data.users) || DEFAULT_USERS;
  state.config = (data && data.config) || DEFAULT_CONFIG;
  state.lists = (data && data.lists) || defaultLists();
  state.submissions = (data && data.submissions) || {};
  state.squadCompletion = (data && data.squadCompletion) || null;
  state.manualAssignments = (data && data.manualAssignments) || {};
  state.finalRosters = (data && data.finalRosters) || null;
  state.repairListings = (data && data.repairListings) || [];
}

async function persistAllDocs(){
  await Promise.all([persistUsers(), persistConfig(), persistLists(), persistSubs(), persistSquadCompletion(), persistManualAssignments(), persistFinalRosters(), persistRepairListings()]);
}

async function loadAll(){
  if(!checkFirebaseConfigured()){
    state.loading = false;
    state.configMissing = true;
    render();
    return;
  }
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    fbReady = true;
  }catch(e){
    state.loading = false;
    state.configError = String(e && e.message || e);
    render();
    return;
  }
  const col = db.collection('fantacalcio_data');

  // Controllo di sicurezza: verifichiamo UNA VOLTA, prima di tutto, se esiste
  // già uno storico di backup automatici. Se esiste, vuol dire che l'app è
  // già stata usata in passato con dati reali: in tal caso, se un documento
  // principale risulta "non esistente", NON lo ricreiamo vuoto in automatico
  // (potrebbe essere stato cancellato per errore) — carichiamo invece
  // temporaneamente in memoria l'ultimo backup disponibile e segnaliamo
  // l'anomalia, lasciando a un amministratore la decisione finale.
  const latestBackup = await fetchLatestBackup();
  const backupsExist = !!latestBackup;
  if(backupsExist) state.anomalyBackupTs = latestBackup.ts;

  function handleDoc(docName, applyValue, defaultValue, backupField){
    col.doc(docName).onSnapshot(async doc=>{
      if(doc.exists){
        applyValue(doc.data().value);
      } else if(backupsExist){
        applyValue((latestBackup.data && latestBackup.data[backupField]) !== undefined ? latestBackup.data[backupField] : defaultValue);
        flagAnomaly(docName);
      } else {
        applyValue(defaultValue);
        await col.doc(docName).set({value: defaultValue});
      }
      loadedDocs.add(docName);
      finishLoadingIfReady();
      render();
    }, docName==='users' ? (err=>{ state.configError = err.message; state.loading=false; render(); }) : undefined);
  }

  handleDoc('users', v=>{ state.users = v; }, DEFAULT_USERS, 'users');
  handleDoc('config', v=>{ state.config = v; }, DEFAULT_CONFIG, 'config');
  handleDoc('submissions', v=>{ state.submissions = v; }, {}, 'submissions');
  handleDoc('squadCompletion', v=>{ state.squadCompletion = v; }, null, 'squadCompletion');
  handleDoc('manualAssignments', v=>{ state.manualAssignments = v; }, {}, 'manualAssignments');
  handleDoc('finalRosters', v=>{ state.finalRosters = v; }, null, 'finalRosters');
  handleDoc('repairListings', v=>{ state.repairListings = v; }, [], 'repairListings');

  col.doc('lists').onSnapshot(async doc=>{
    if(doc.exists){ state.lists = doc.data().value; }
    else if(backupsExist){
      state.lists = (latestBackup.data && latestBackup.data.lists) || defaultLists();
      flagAnomaly('lists');
    } else {
      state.lists = defaultLists(); await col.doc('lists').set({value: state.lists});
    }
    // Migrazione: se il documento esisteva già senza le liste aperte, le crea
    let needsMigration = false;
    OPEN_LISTS_META.forEach(m=>{
      if(!state.lists[m.id]){
        state.lists[m.id] = {id:m.id, label:m.label, players:[], openAt:null, closeAt:null, status:'setup', assigned:null, assignedPlayers:null, lockedAt:{}};
        needsMigration = true;
      }
    });
    // Migrazione: aggiunge lockedAt (blocco compilazione per riapertura) alle liste esistenti
    [...LISTS_META, ...OPEN_LISTS_META].forEach(m=>{
      if(state.lists[m.id] && !state.lists[m.id].lockedAt){
        state.lists[m.id].lockedAt = {};
        needsMigration = true;
      }
    });
    if(needsMigration && !state.dataAnomaly) await col.doc('lists').set({value: state.lists});
    loadedDocs.add('lists');
    finishLoadingIfReady();
    render();
  });
}

function finishLoadingIfReady(){
  if(['users','config','lists','submissions','squadCompletion','manualAssignments','finalRosters','repairListings'].every(k=>loadedDocs.has(k))){
    state.loading = false;
  }
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fmtCredits(n){

function attachLoginHandlers(){
  const f = document.getElementById('login-form');
  if(!f) return;
  f.addEventListener('submit', e=>{
    e.preventDefault();
    const u = document.getElementById('lu').value.trim();
    const p = document.getElementById('lp').value;
    const found = state.users.find(x=>x.username===u && x.password===p);
    if(!found){ state.loginError = 'Nome utente o password non corretti.'; render(); return; }
    state.currentUser = found.username;
    state.loginError = '';
    state.view = found.role==='admin' ? 'admin' : 'user';
    render();
  });
  const toggleAdmin = document.getElementById('toggle-admin-login');
  if(toggleAdmin) toggleAdmin.addEventListener('click', e=>{
    e.preventDefault();
    state.loginAdminMode = !state.loginAdminMode;
    state.loginError = '';
    render();
  });
}

function toLocalInput(iso){
  const d = new Date(iso);
  const pad = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function listStatus(list){
  if(list.status==='computed') return 'computed';
  const now = Date.now();
  if(list.openAt && list.closeAt){
    const o = new Date(list.openAt).getTime(), c = new Date(list.closeAt).getTime();
    if(now < o) return 'setup';
    if(now >= o && now < c) return 'open';
    if(now >= c) return 'closed';
  }
  return 'setup';
}

function attachAdminHandlers(){
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      state.adminTab = b.dataset.tab;
      if(state.adminTab==='backup') loadBackupsList().then(render);
      render();
    });
  });

  const confirmAnomalyBtn = document.getElementById('btn-confirm-anomaly-restore');
  if(confirmAnomalyBtn) confirmAnomalyBtn.addEventListener('click', async ()=>{
    if(!confirm('Salvare permanentemente questo backup sui dati live? Sostituirà i documenti mancanti.')) return;
    await persistAllDocs();
    state.dataAnomaly = null;
    showToast('Backup confermato e salvato.');
    render();
  });
  const gotoBackupBtn = document.getElementById('btn-goto-backup-tab');
  if(gotoBackupBtn) gotoBackupBtn.addEventListener('click', ()=>{
    state.adminTab = 'backup';
    loadBackupsList().then(render);
    render();
  });

  const dlBackupBtn = document.getElementById('btn-download-backup');
  if(dlBackupBtn) dlBackupBtn.addEventListener('click', ()=>{
    const payload = {exportedAt: new Date().toISOString(), ...snapshotState()};
    const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `fantacalcio_backup_${Date.now()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  });
  const importBackupInput = document.getElementById('input-import-backup');
  if(importBackupInput) importBackupInput.addEventListener('change', async ()=>{
    const file = importBackupInput.files[0];
    if(!file) return;
    if(!confirm('Importare questo file sovrascriverà TUTTI i dati attuali (utenti, liste, offerte, assegnazioni). Continuare?')){ importBackupInput.value=''; return; }
    try{
      const data = JSON.parse(await file.text());
      applyBackupData(data);
      await persistAllDocs();
      state.dataAnomaly = null;

function buildAssignmentPreview(listId){
  const list = state.lists[listId];
  const subs = state.submissions[listId] || {};
  const allUsers = state.users.filter(u=>u.role!=='admin').map(u=>u.username);
  let remainingPlayers = list.players.map(p=>p.name);
  let unassigned = new Set(allUsers);
  const assignment = {};
  for(let round=0; round<6; round++){
    const bidsByPlayer = {};
    unassigned.forEach(u=>{
      const arr = subs[u];
      const pref = arr && arr[round];
      if(pref && remainingPlayers.includes(pref.player)){
        (bidsByPlayer[pref.player] = bidsByPlayer[pref.player]||[]).push({username:u, bid:pref.bid});
      }
    });
    Object.entries(bidsByPlayer).forEach(([player, bidders])=>{
      let winner;
      if(bidders.length===1){ winner = bidders[0]; }
      else{
        const maxBid = Math.max(...bidders.map(b=>b.bid));
        const top = bidders.filter(b=>b.bid===maxBid);
        winner = top[Math.floor(Math.random()*top.length)];
      }
      assignment[winner.username] = {player, price: winner.bid, round: round+1};
      unassigned.delete(winner.username);
      remainingPlayers = remainingPlayers.filter(p=>p!==player);
    });
  }
  return {assignment, unassignedUsers: Array.from(unassigned), remainingPlayers};
}

async function computeAssignment(listId){
  const list = state.lists[listId];
  const {assignment, unassignedUsers, remainingPlayers} = buildAssignmentPreview(listId);

  const shuffled = remainingPlayers.slice();
  for(let i=shuffled.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]; }
  unassignedUsers.forEach((u,i)=>{
    const player = shuffled[i];
    const minBid = player ? (list.players.find(p=>p.name===player)?.minBid || 0) : 0;
    assignment[u] = {player: player || 'Nessun giocatore disponibile', price: player?minBid:0, round:'random'};
  });

  const previouslyComputed = list.status==='computed' && list.assigned;
  if(previouslyComputed){
    Object.entries(list.assigned).forEach(([u,a])=>{
      const usr = state.users.find(x=>x.username===u);
      if(usr) usr.credits += a.price;
    });
  }
  Object.entries(assignment).forEach(([u,a])=>{
    const usr = state.users.find(x=>x.username===u);
    if(usr) usr.credits -= a.price;
  });

  list.assigned = assignment;
  list.status = 'computed';
  await persistLists();
  await persistUsers();
}
// ================= LISTE APERTE: ASSEGNAZIONE =================
// Per ogni giocatore richiesto da più utenti vince l'offerta più alta,
// indipendentemente dalla posizione occupata nelle 6 preferenze.
// A differenza delle liste a ruolo, in una singola lista aperta un utente
// può aggiudicarsi da 0 a 6 giocatori (uno per ciascuna preferenza vinta).
function buildOpenAssignmentPreview(listId){
  const list = state.lists[listId];
  const subs = state.submissions[listId] || {};
  const bidsByPlayer = {};
  Object.entries(subs).forEach(([username, prefs])=>{
    (prefs||[]).forEach(p=>{
      if(!p || !p.player) return;
      (bidsByPlayer[p.player] = bidsByPlayer[p.player]||[]).push({username, bid:p.bid});
    });
  });
  const winners = {}; // player -> {username, price}
  Object.entries(bidsByPlayer).forEach(([player, bidders])=>{
    let winner;
    if(bidders.length===1){ winner = bidders[0]; }
    else{
      const maxBid = Math.max(...bidders.map(b=>b.bid));
      const top = bidders.filter(b=>b.bid===maxBid);
      winner = top[Math.floor(Math.random()*top.length)];
    }
    winners[player] = {username:winner.username, price:winner.bid};
  });
  return winners;
}

async function computeOpenAssignment(listId){
  const list = state.lists[listId];
  const winners = buildOpenAssignmentPreview(listId);

  // Se si ricalcola, prima restituisco i crediti già scalati in precedenza
  if(list.status==='computed' && list.assigned){
    Object.entries(list.assigned).forEach(([u,arr])=>{
      const usr = state.users.find(x=>x.username===u);
      if(usr) arr.forEach(a=>{ usr.credits += a.price; });
    });
  }

  const perUser = {};
  Object.entries(winners).forEach(([player,a])=>{
    const plObj = list.players.find(p=>p.name===player);
    (perUser[a.username] = perUser[a.username]||[]).push({player, price:a.price, role: plObj?plObj.role:null});
    const usr = state.users.find(x=>x.username===a.username);
    if(usr) usr.credits -= a.price;
  });

  list.assigned = perUser;
  list.assignedPlayers = winners; // player -> vincitore, usato per generare il round 2
  list.status = 'computed';
  await persistLists();
  await persistUsers();
}

// Copia nel round 2 solo i giocatori del round 1 rimasti senza vincitore.
function generateRound2FromRound1(){
  const round1 = state.lists.OPEN1;
  const won = new Set(Object.keys(round1.assignedPlayers || {}));
  state.lists.OPEN2.players = round1.players.filter(p=>!won.has(p.name));
  state.lists.OPEN2.status = 'setup';
  state.lists.OPEN2.assigned = null;
  state.lists.OPEN2.assignedPlayers = null;
}

// ================= COMPLETAMENTO ROSE =================
// Copre i ruoli mancanti (8 D, 8 C, 4 A a testa) usando i giocatori rimasti
// scoperti dopo i due round di lista aperta, in ordine di quotazione
// decrescente: ad ogni assegnazione paga chi ha più crediti tra chi ha
// ancora bisogno di quel ruolo, al doppio della quotazione, e la classifica
// dei crediti viene ricalcolata prima di ogni assegnazione.
function countRolesAssigned(){
  const counts = {}; // username -> {D:n,C:n,A:n,P:n}
  state.users.filter(u=>u.role!=='admin').forEach(u=>{ counts[u.username] = {D:0,C:0,A:0,P:0}; });
  LISTS_META.forEach(m=>{
    const list = state.lists[m.id];
    const role = LIST_ROLE[m.id];
    if(list && list.assigned){
      Object.entries(list.assigned).forEach(([u,a])=>{
        if(counts[u] && a && a.player) counts[u][role]++;
      });
    }
  });
  OPEN_LISTS_META.forEach(m=>{
    const list = state.lists[m.id];
    if(list && list.assigned){
      Object.entries(list.assigned).forEach(([u,arr])=>{
        (arr||[]).forEach(a=>{ if(counts[u] && a.role) counts[u][a.role]++; });
      });
    }
  });
  if(state.squadCompletion){
    Object.entries(state.squadCompletion.assigned).forEach(([u,arr])=>{
      arr.forEach(a=>{ if(counts[u] && a.role) counts[u][a.role]++; });
    });
  }
  if(state.manualAssignments){
    Object.entries(state.manualAssignments).forEach(([u,arr])=>{
      (arr||[]).forEach(a=>{ if(counts[u] && a.role) counts[u][a.role]++; });
    });
  }
  return counts;
}

async function computeSquadCompletion(){
  const counts = countRolesAssigned();
  const won1 = new Set(Object.keys(state.lists.OPEN1.assignedPlayers || {}));
  const won2 = new Set(Object.keys(state.lists.OPEN2.assignedPlayers || {}));
  // Giocatori venduti nell'asta di riparazione: se questa è già stata
  // calcolata, i suoi svincolati rimasti (invenduti) rientrano nel pool qui
  // sotto e vengono ridistribuiti come un secondo completamento rose.
  const wonRepair = new Set(Object.keys(state.lists.REPAIR.assignedPlayers || {}));
  const wonManual = new Set();
  if(state.manualAssignments){
    Object.values(state.manualAssignments).forEach(arr=>(arr||[]).forEach(a=>wonManual.add(a.player)));
  }
  const repairPlayers = state.lists.REPAIR.status==='computed' ? state.lists.REPAIR.players : [];
  const catalog = [...state.lists.OPEN1.players, ...state.lists.OPEN2.players, ...repairPlayers];
  const seen = new Set();
  let pool = catalog.filter(p=>{
    if(seen.has(p.name)) return false;
    seen.add(p.name);
    return !won1.has(p.name) && !won2.has(p.name) && !wonRepair.has(p.name) && !wonManual.has(p.name) && ROLE_QUOTA[p.role];
  });
  pool.sort((a,b)=> b.minBid - a.minBid); // dal più caro al più economico

  // Se si ricalcola, prima restituisco i crediti già scalati in precedenza
  if(state.squadCompletion){
    Object.entries(state.squadCompletion.assigned).forEach(([u,arr])=>{
      const usr = state.users.find(x=>x.username===u);
      if(usr) arr.forEach(a=>{ usr.credits += a.price; });
    });
  }

  const assigned = {};
  pool.forEach(player=>{
    const eligible = state.users.filter(u=>
      u.role!=='admin' && counts[u.username][player.role] < ROLE_QUOTA[player.role]
    );
    if(eligible.length===0) return;
    eligible.sort((a,b)=> b.credits - a.credits);
    const winner = eligible[0];
    const price = player.minBid;
    winner.credits -= price;
    counts[winner.username][player.role]++;
    (assigned[winner.username] = assigned[winner.username]||[]).push({player:player.name, price, role:player.role});
  });

  state.squadCompletion = {assigned, computedAt: new Date().toISOString()};
  await persistSquadCompletion();
  await persistUsers();
}

// ================= ROSE UTENTE =================
// Ricostruisce la rosa di un utente sommando tutte le fonti "storiche"
// (liste a ruolo, liste aperte, completamento rose, assegnazioni manuali).
// Usata SOLO finché non è stata importata una rosa aggiornata da file per
// quell'utente: se l'admin corregge a mano le assegnazioni fuori da questi
// meccanismi, questo calcolo smette di essere affidabile ed è preferibile
// caricare le rose complete aggiornate (vedi importRostersFromGrid).
function buildComputedRoster(username){
  const out = [];
  LISTS_META.forEach(m=>{
    const list = state.lists[m.id];
    const a = list && list.assigned && list.assigned[username];
    if(a && a.player) out.push({player:a.player, price:Number(a.price)||0, role:LIST_ROLE[m.id]||''});
  });
  OPEN_LISTS_META.forEach(m=>{
    const list = state.lists[m.id];
    if(!list || !list.assigned) return;
    (list.assigned[username]||[]).forEach(a=>{ out.push({player:a.player, price:Number(a.price)||0, role:a.role||''}); });
  });
  if(state.squadCompletion && state.squadCompletion.assigned){
    (state.squadCompletion.assigned[username]||[]).forEach(a=>{ out.push({player:a.player, price:Number(a.price)||0, role:a.role||''}); });
  }
  if(state.manualAssignments){
    (state.manualAssignments[username]||[]).forEach(a=>{ out.push({player:a.player, price:Number(a.price)||0, role:a.role||''}); });
  }
  return out;
}

// Rosa "corrente" mostrata all'utente: usa la rosa importata da file se
// presente (fonte di verità), altrimenti quella calcolata; toglie sempre i
// giocatori che l'utente ha messo all'asta di riparazione: il giocatore
// esce dalla rosa e il rimborso viene dato subito alla nomina, quindi resta
// escluso per sempre (venduto ad altri o svincolato per il completamento
// rose successivo) e non torna più tra i giocatori dell'ex proprietario.
function getUserRoster(username){
  const base = (state.finalRosters && state.finalRosters[username])
    ? state.finalRosters[username].map(p=>({player:p.player, price:Number(p.price)||0, role:p.role||''}))
    : buildComputedRoster(username);
  const listedNow = new Set((state.repairListings||[]).filter(l=>l.username===username).map(l=>l.player));
  return base.filter(p=>!listedNow.has(p.player));
}

// Aggiunge al listone dell'asta di riparazione tutte le nomine degli utenti
// non ancora risolte e non ancora presenti nel listone corrente. Va lanciata
// dall'admin prima di aprire un round di offerte.
function addPendingNominationsToRepairList(){
  const list = state.lists.REPAIR;
  const inListNames = new Set(list.players.map(p=>p.name));
  const toAdd = (state.repairListings||[]).filter(l=>!l.resolved && !inListNames.has(l.player));
  toAdd.forEach(l=>{
    list.players.push({name:l.player, minBid:l.minBid, role:l.role||'', owner:l.username, originalPrice:l.price});
  });
  return toAdd.length;
}

// Calcola l'assegnazione dell'asta di riparazione riusando il motore delle
// liste aperte (vince l'offerta più alta per ciascun giocatore), poi:
// - scala i crediti al vincitore (come una lista aperta normale)
// I crediti al proprietario originale sono già stati restituiti subito al
// momento della nomina (vedi attachRepairNominationHandlers), quindi qui non
// si rimborsa più nessuno: il giocatore non torna mai al vecchio proprietario.
// I giocatori del round senza offerte restano "svincolati": non tornano in
// nessuna rosa, ma restano disponibili per il completamento rose che
// l'admin lancia di nuovo dopo l'asta di riparazione (vedi computeSquadCompletion).
// Ricalcolabile: se richiamata di nuovo, prima annulla tutto quanto fatto
// dal calcolo precedente (crediti dei vincitori e spostamenti in state.finalRosters).
async function computeRepairAssignment(){
  const list = state.lists.REPAIR;

  if(list.status==='computed' && list.assigned){
    // storna il prezzo pagato dai vincitori del calcolo precedente
    Object.entries(list.assigned).forEach(([u,arr])=>{
      const usr = state.users.find(x=>x.username===u);
      if(usr) arr.forEach(a=>{ usr.credits += a.price; });
    });
    // toglie il giocatore dalla rosa del vincitore del calcolo precedente
    // (torna "svincolato", non al vecchio proprietario) e ripristina lo
    // stato "non risolto" delle nomine di questo round, così il ricalcolo
    // riparte da zero
    list.players.forEach(p=>{
      if(!p.owner) return;
      const wasWon = list.assignedPlayers && list.assignedPlayers[p.name];
      if(wasWon && state.finalRosters){
        const prevWinner = wasWon.username;
        if(state.finalRosters[prevWinner]) state.finalRosters[prevWinner] = state.finalRosters[prevWinner].filter(x=>x.player!==p.name);
      }
      const listing = state.repairListings.find(l=>l.username===p.owner && l.player===p.name);
      if(listing){ listing.resolved=false; listing.wonBy=null; listing.finalPrice=null; listing.returnedUnsold=false; }
    });
  }

  const winners = buildOpenAssignmentPreview('REPAIR');
  const perUser = {};
  Object.entries(winners).forEach(([player,a])=>{
    const plObj = list.players.find(p=>p.name===player);
    (perUser[a.username] = perUser[a.username]||[]).push({player, price:a.price, role: plObj?plObj.role:null});
    const usr = state.users.find(x=>x.username===a.username);
    if(usr) usr.credits -= a.price;
    if(plObj && plObj.owner){
      if(state.finalRosters){
        if(state.finalRosters[plObj.owner]) state.finalRosters[plObj.owner] = state.finalRosters[plObj.owner].filter(x=>x.player!==player);
        if(!state.finalRosters[a.username]) state.finalRosters[a.username] = [];
        state.finalRosters[a.username].push({player, price:a.price});
      }
      const listing = state.repairListings.find(l=>l.username===plObj.owner && l.player===player);
      if(listing){ listing.resolved=true; listing.wonBy=a.username; listing.finalPrice=a.price; }
    }
  });
  list.players.forEach(p=>{
    if(!winners[p.name] && p.owner){
      // Invenduto: resta svincolato, disponibile per il completamento rose
      // successivo. Non torna al vecchio proprietario (già rimborsato).
      const listing = state.repairListings.find(l=>l.username===p.owner && l.player===p.name);
      if(listing){ listing.resolved=true; listing.returnedUnsold=true; }
    }
  });

  list.assigned = perUser;
  list.assignedPlayers = winners;
  list.status = 'computed';
  await Promise.all([persistLists(), persistUsers(), persistRepairListings(), persistFinalRosters()]);
}

// Ordine fisso dei ruoli nel blocco di ogni squadra: le prime N1 righe sono
// Portieri, le N2 successive Difensori, le N3 successive Centrocampisti, le
// ultime N4 Attaccanti (schema standard 3P/8D/8C/4A, riconoscibile anche dal
// colore di sfondo delle celle nel file originale). La posizione è fissa per
// slot di rosa, quindi va contata sulla riga assoluta del blocco e non sugli
// indici dei soli giocatori trovati, altrimenti un giocatore mancante
// sfaserebbe i ruoli successivi.
const ROSTER_ROLE_SLOTS = [
  {role:'P', count:3},
  {role:'D', count:8},
  {role:'C', count:8},
  {role:'A', count:4},
];
function roleForSlot(slotIndex){
  // slotIndex: posizione 0-based della riga all'interno del blocco squadra
  // (0 = prima riga dopo l'intestazione nome/costo).
  let acc = 0;
  for(const s of ROSTER_ROLE_SLOTS){
    if(slotIndex < acc + s.count) return s.role;
    acc += s.count;
  }
  return null; // oltre lo schema noto: ruolo sconosciuto, non blocchiamo l'import
}

// Legge una griglia (array di array, come restituita da XLSX
// sheet_to_json({header:1})) nello stesso formato usato dall'export
// dell'app: per ogni squadra un blocco di 3 colonne (nome, costo, vuota),
// righe = giocatori, blocco termina alla riga "totale". Il ruolo di ogni
// giocatore è dedotto dalla posizione fissa della riga nel blocco (vedi
// ROSTER_ROLE_SLOTS sopra), non dal testo o dal colore della cella, perché
// XLSX.utils.sheet_to_json non porta con sé la formattazione delle celle.
function parseRosterGrid(grid){
  // Usiamo la larghezza massima fra TUTTE le righe (non solo la riga 0)
  // per decidere quante colonne/squadre scandire: se la riga di
  // intestazione risulta più corta delle righe sottostanti (es. l'ultima
  // squadra ha nome corto o celle formattate in modo diverso), usare solo
  // header.length tagliava fuori le squadre più a destra.
  const colCount = grid.reduce((max,row)=> Math.max(max, row ? row.length : 0), 0);
  const header = grid[0] || [];
  const teams = [];
  for(let c=0;c<colCount;c+=3){
    const teamName = header[c];
    if(teamName==null || String(teamName).trim()==='') continue;
    const players = [];
    let slotIndex = 0;
    for(let r=1;r<grid.length;r++){
      const row = grid[r] || [];
      const name = row[c];
      if(name!=null && String(name).trim().toLowerCase()==='totale') break;
      if(name==null || String(name).trim()===''){ slotIndex++; continue; }
      const price = parseFloat(row[c+1]);
      const role = roleForSlot(slotIndex);
      players.push({name:String(name).trim(), price:isNaN(price)?0:price, role});
      slotIndex++;
    }
    teams.push({excelName:String(teamName).trim(), players});
  }
  return teams;
}

function renderTile(m){
  const list = state.lists[m.id];
  const st = listStatus(list);
  const me = state.currentUser;
  const subs = state.submissions[m.id] || {};
  const mySub = subs[me];
  const hasSubmitted = !!mySub;
  const isLocked = hasSubmitted && !!(list.lockedAt && list.lockedAt[me] === list.openAt);
  let statusHtml = '';
  let clickable = true;
  if(st==='setup'){
    statusHtml = `<div class="status-line notopen">Non ancora aperta</div>`;
    clickable = false;
  } else if(st==='open'){
    if(isLocked){
      statusHtml = `<div class="status-line done">Compilato</div>`;
    } else {
      statusHtml = `<div class="status-line countdown mono" data-countdown="${m.id}" data-close="${list.closeAt}">--:--:--</div>`;
    }
  } else if(st==='closed'){
    statusHtml = `<div class="status-line closed">Lista chiusa</div>`;
    clickable = hasSubmitted;
  } else if(st==='computed'){
    const mine = list.assigned && list.assigned[me];
    statusHtml = mine ? `<div class="status-line done">Assegnato</div><div class="assigned-player">${esc(mine.player)} · ${fmtCredits(mine.price)} cr</div>` : `<div class="status-line closed">Lista chiusa</div>`;
    clickable = false;
  }
  return `
  <div class="tile ${clickable?'':'disabled'}" tabindex="0" role="button" data-open-tile="${m.id}" data-clickable="${clickable}">
    <div class="role-label">${list.players.length} giocatori</div>
    <h4>${esc(list.label)}</h4>
    ${statusHtml}
  </div>`;
}

    <div class="modal-overlay" id="modal-overlay">
      <div class="modal-box">
        <h2>${esc(list.label)} — le tue preferenze</h2>
        ${filled.length===0?'<p class="empty-note">Nessuna preferenza inviata.</p>':filled.map(p=>`<div class="summary-row"><span>${esc(p.player)}</span><span class="bid mono">${fmtCredits(p.bid)} cr</span></div>`).join('')}
        <div class="modal-actions"><button class="btn-secondary" id="modal-close">Chiudi</button></div>
      </div>
    </div>`;
  }

  const sumBids = state.prefDraft.reduce((s,p)=> s + (parseFloat(p.bid)||0), 0);
  return `
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-box">
      <h2>${esc(list.label)}</h2>
      <p class="desc" style="margin-bottom:16px;">Indica fino a 6 giocatori, senza obbligo di compilarli tutti e senza ordine di preferenza. In caso di richieste multiple sullo stesso giocatore vince l'offerta più alta. La somma delle offerte non può superare i tuoi crediti residui (${fmtCredits(meObj.credits)}).</p>
      ${state.prefDraft.map((p,i)=>`
        <div class="pref-row">
          <div class="num">${i+1}</div>
          <div class="ac-wrap">
            <input type="text" autocomplete="off" placeholder="Cerca giocatore..." data-openpref-player="${i}" value="${esc(p.player)}">
            <div class="ac-suggestions" data-openpref-suggest="${i}" hidden></div>
          </div>
          <input type="number" placeholder="Offerta" data-openpref-bid="${i}" value="${esc(p.bid)}">
        </div>
        ${state.prefErrors[i] ? `<div class="pref-err">${esc(state.prefErrors[i])}</div>` : ''}
      `).join('')}
      <div class="hint">Totale offerte: <span class="mono" id="ac-sum-total">${fmtCredits(sumBids)}</span> / ${fmtCredits(meObj.credits)} crediti disponibili</div>
      ${state.prefErrors.sum ? `<div class="pref-err">${esc(state.prefErrors.sum)}</div>` : ''}
      <div class="modal-actions">
        <button class="btn-secondary" id="modal-cancel">Annulla</button>
        <button class="btn-primary" style="width:auto;" id="modal-confirm-open">Conferma preferenze</button>
      </div>
    </div>
  </div>`;
}

function attachUserHandlers(){
  document.querySelectorAll('[data-open-tile]').forEach(t=>{
    const openIt = ()=>{
      if(t.dataset.clickable !== 'true') return;
      state.openListId = t.dataset.openTile;
      state.prefDraft = null;
      state.prefErrors = {};
      render();
    };
    t.addEventListener('click', openIt);
    t.addEventListener('keydown', e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openIt(); } });
  });
    startCountdowns();
    if(state.openListId && OPEN_LISTS_META.some(m=>m.id===state.openListId)){
    attachOpenModalHandlers();
  } else {
    attachModalHandlers();
  }
  attachRepairNominationHandlers();
}

function attachRepairNominationHandlers(){
  document.querySelectorAll('[data-nominate-idx]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const idx = parseInt(btn.dataset.nominateIdx);
      const roster = getUserRoster(state.currentUser);
      const entry = roster[idx];
      if(!entry) return;
      const activeCount = (state.repairListings||[]).filter(l=>l.username===state.currentUser && !l.resolved).length;
      if(activeCount >= REPAIR_NOMINATION_LIMIT){
        showToast(`Hai raggiunto il limite massimo di ${REPAIR_NOMINATION_LIMIT} svincoli.`);
        return;
      }
      const minInput = document.querySelector(`[data-nominate-min-idx="${idx}"]`);
      const minBid = parseFloat(minInput.value);
      if(isNaN(minBid) || minBid<0){ showToast("Base d'asta non valida."); return; }
      const roleSelect = document.querySelector(`[data-nominate-role-idx="${idx}"]`);
      const role = roleSelect ? roleSelect.value : '';
      if(!role){ showToast('Seleziona il ruolo del giocatore.'); return; }
      if(!confirm(`Mettere ${entry.player} all'asta di riparazione? Esce subito dalla tua rosa e i crediti pagati (${fmtCredits(entry.price)}) ti vengono restituiti subito.`)) return;
      state.repairListings.push({
        id: uid(), username: state.currentUser, player: entry.player, price: entry.price,
        minBid, role, addedAt: new Date().toISOString(), resolved:false, wonBy:null, finalPrice:null, returnedUnsold:false
      });
      // Rimborso immediato: il giocatore esce subito e definitivamente dalla
      // rosa, indipendentemente dall'esito dell'asta di riparazione (venduto
      // o svincolato per il completamento rose successivo).
      const me = state.users.find(u=>u.username===state.currentUser);
      if(me) me.credits += entry.price;
      await Promise.all([persistRepairListings(), persistUsers()]);
      showToast('Giocatore messo all\'asta di riparazione e crediti restituiti.');
      render();
    });
  });
  document.querySelectorAll('[data-cancel-nomination]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.cancelNomination;
      const listing = state.repairListings.find(l=>l.id===id);
      if(listing){
        // Annulla il rimborso dato alla nomina: il giocatore torna in rosa.
        const owner = state.users.find(u=>u.username===listing.username);
        if(owner) owner.credits -= listing.price;
      }
      state.repairListings = state.repairListings.filter(l=>l.id!==id);
      await Promise.all([persistRepairListings(), persistUsers()]);
      showToast('Nomina ritirata.');
      render();
    });
  });
}

function attachModalHandlers(){
  const overlay = document.getElementById('modal-overlay');
  if(!overlay) return;
  const close = ()=>{ state.openListId=null; state.prefDraft=null; state.prefErrors={}; render(); };
  const closeBtn = document.getElementById('modal-close');
  if(closeBtn) closeBtn.addEventListener('click', close);
  const cancelBtn = document.getElementById('modal-cancel');
  if(cancelBtn) cancelBtn.addEventListener('click', close);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });

  document.querySelectorAll('[data-pref-player]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const i = parseInt(sel.dataset.prefPlayer);
      state.prefDraft[i].player = sel.value;
      render();
    });
  });
  document.querySelectorAll('[data-pref-bid]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const i = parseInt(inp.dataset.prefBid);
      state.prefDraft[i].bid = inp.value;
    });
  });
    const confirmBtn = document.getElementById('modal-confirm');
    if(confirmBtn) confirmBtn.addEventListener('click', async ()=>{
      document.querySelectorAll('[data-pref-bid]').forEach(inp=>{
      const i = parseInt(inp.dataset.prefBid);
      state.prefDraft[i].bid = inp.value;
    });
    const list = state.lists[state.openListId];
    const me = currentUserObj();
    const errors = {};
    const chosenNames = new Set();
    state.prefDraft.forEach((p,i)=>{
      if(!p.player){ errors[i]='Seleziona un giocatore.'; return; }
      if(chosenNames.has(p.player)){ errors[i]="Giocatore già scelto in un'altra preferenza."; return; }
      chosenNames.add(p.player);
      const plObj = list.players.find(pl=>pl.name===p.player);
      const bidNum = parseFloat(p.bid);
      if(!plObj){ errors[i]='Giocatore non valido.'; return; }
      if(isNaN(bidNum) || bidNum < plObj.minBid){ errors[i]=`L'offerta deve essere almeno ${fmtCredits(plObj.minBid)}.`; return; }
      if(bidNum > me.credits){ errors[i]=`L'offerta supera i tuoi crediti residui (${fmtCredits(me.credits)}).`; return; }
    });
    if(Object.keys(errors).length>0){
      state.prefErrors = errors;
      render();
      return;
    }
    
    const final = state.prefDraft.map(p=>({player:p.player, bid:parseFloat(p.bid)}));
    if(!state.submissions[state.openListId]) state.submissions[state.openListId] = {};
    state.submissions[state.openListId][state.currentUser] = final;
    if(!list.lockedAt) list.lockedAt = {};
    list.lockedAt[state.currentUser] = list.openAt || null;
    await Promise.all([persistSubs(), persistLists()]);
    state.openListId = null;
    state.prefDraft = null;
    state.prefErrors = {};
    showToast('Preferenze salvate.');
    render();
  });
}

function attachOpenModalHandlers(){
  const overlay = document.getElementById('modal-overlay');
  if(!overlay) return;
  const close = ()=>{ state.openListId=null; state.prefDraft=null; state.prefErrors={}; render(); };
  const closeBtn = document.getElementById('modal-close');
  if(closeBtn) closeBtn.addEventListener('click', close);
  const cancelBtn = document.getElementById('modal-cancel');
  if(cancelBtn) cancelBtn.addEventListener('click', close);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });

  const list = state.lists[state.openListId];

  const updateSumHint = ()=>{
    const sumEl = document.getElementById('ac-sum-total');
    if(!sumEl) return;
    const sum = state.prefDraft.reduce((s,p)=> s + (parseFloat(p.bid)||0), 0);
    sumEl.textContent = fmtCredits(sum);
  };

  // Autocompletamento: al posto della select, un campo di testo che
  // suggerisce i nomi dei giocatori disponibili man mano che si digita.
  document.querySelectorAll('[data-openpref-player]').forEach(inp=>{
    const i = parseInt(inp.dataset.openprefPlayer);
    const box = document.querySelector(`[data-openpref-suggest="${i}"]`);
    if(!box) return;

    const pick = (name)=>{
      inp.value = name;
      state.prefDraft[i].player = name;
      inp.classList.remove('invalid');
      box.hidden = true;
      updateSumHint();
    };

    const renderSuggestions = ()=>{
      const q = inp.value.trim().toLowerCase();
      const usedElsewhere = state.prefDraft.map((p,idx)=> idx!==i ? p.player : '').filter(Boolean);
      const matches = list.players
        .filter(pl=> !usedElsewhere.includes(pl.name) && (q==='' || pl.name.toLowerCase().includes(q)))
        .slice(0,8);
      box.innerHTML = matches.length===0
        ? `<div class="ac-empty">Nessun giocatore trovato</div>`
        : matches.map(pl=>`<div class="ac-item" data-ac-pick="${esc(pl.name)}"><span class="ac-name">${esc(pl.name)}</span><span class="ac-meta">min ${fmtCredits(pl.minBid)} · ${esc(pl.role)}</span></div>`).join('');
      box.hidden = false;
      box.querySelectorAll('[data-ac-pick]').forEach(item=>{
        // mousedown (non click) per anticipare il blur dell'input
        item.addEventListener('mousedown', e=>{ e.preventDefault(); pick(item.dataset.acPick); });
      });
    };

    inp.addEventListener('focus', renderSuggestions);
    inp.addEventListener('input', ()=>{
      state.prefDraft[i].player = inp.value;
      const exact = list.players.some(pl=>pl.name===inp.value.trim());
      inp.classList.toggle('invalid', inp.value.trim()!=='' && !exact);
      renderSuggestions();
      updateSumHint();
    });
    inp.addEventListener('blur', ()=>{ setTimeout(()=>{ box.hidden = true; }, 150); });
    inp.addEventListener('keydown', e=>{
      if(e.key==='Escape'){ box.hidden = true; inp.blur(); }
      else if(e.key==='Enter'){
        e.preventDefault();
        const exactMatch = list.players.find(pl=>pl.name.toLowerCase()===inp.value.trim().toLowerCase());
        const firstItem = box.querySelector('[data-ac-pick]');
        const target = exactMatch ? exactMatch.name : (firstItem ? firstItem.dataset.acPick : null);
        if(target) pick(target); else box.hidden = true;
      }
    });
  });
  document.querySelectorAll('[data-openpref-bid]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const i = parseInt(inp.dataset.openprefBid);
      state.prefDraft[i].bid = inp.value;
      updateSumHint();
    });
  });

  const confirmBtn = document.getElementById('modal-confirm-open');
  if(confirmBtn) confirmBtn.addEventListener('click', async ()=>{
    document.querySelectorAll('[data-openpref-bid]').forEach(inp=>{
      const i = parseInt(inp.dataset.openprefBid);
      state.prefDraft[i].bid = inp.value;
    });
    const list = state.lists[state.openListId];
    const me = currentUserObj();
    const errors = {};
    const chosenNames = new Set();
    let sum = 0;
    state.prefDraft.forEach((p,i)=>{
      if(!p.player) return; // riga vuota, ammessa
      if(chosenNames.has(p.player)){ errors[i]="Giocatore già scelto in un'altra preferenza."; return; }
      chosenNames.add(p.player);
      const plObj = list.players.find(pl=>pl.name===p.player);
      const bidNum = parseFloat(p.bid);
      if(!plObj){ errors[i]='Giocatore non valido.'; return; }
      if(isNaN(bidNum) || bidNum < plObj.minBid){ errors[i]=`L'offerta deve essere almeno ${fmtCredits(plObj.minBid)}.`; return; }
      sum += bidNum;
    });
    if(sum > me.credits){ errors.sum = `La somma delle offerte (${fmtCredits(sum)}) supera i crediti residui (${fmtCredits(me.credits)}).`; }
    if(Object.keys(errors).length>0){
      state.prefErrors = errors;
      render();
      return;
    }
    const final = state.prefDraft.filter(p=>p.player).map(p=>({player:p.player, bid:parseFloat(p.bid)}));
    if(!state.submissions[state.openListId]) state.submissions[state.openListId] = {};
    state.submissions[state.openListId][state.currentUser] = final;
    if(!list.lockedAt) list.lockedAt = {};
    list.lockedAt[state.currentUser] = list.openAt || null;
    await Promise.all([persistSubs(), persistLists()]);
    state.openListId = null;
    state.prefDraft = null;
    state.prefErrors = {};
    showToast('Preferenze salvate.');
    render();
  });
}

let countdownTimer = null;
function startCountdowns(){
  if(countdownTimer) clearInterval(countdownTimer);
  const tick = ()=>{
    document.querySelectorAll('[data-countdown]').forEach(el=>{
      const close = el.dataset.close;
      if(!close) return;
      const diff = new Date(close).getTime() - Date.now();
      if(diff<=0){ el.textContent = 'Chiusura in corso...'; return; }
      const h = Math.floor(diff/3600000);
      const m = Math.floor((diff%3600000)/60000);
      const s = Math.floor((diff%60000)/1000);
      el.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    });
  };
  tick();
  countdownTimer = setInterval(tick, 1000);
}

// ================= ROOT RENDER =================
function render(){
  const app = document.getElementById('app');
  if(state.configMissing){
    app.innerHTML = `<div class="login-screen"><div class="login-card"><h1>Configurazione mancante</h1><p class="sub">Questo file non è ancora collegato a un database. Apri il codice sorgente del file, cerca "firebaseConfig" all'inizio del tag &lt;script&gt; e incolla lì i dati del tuo progetto Firebase (vedi le istruzioni nei commenti).</p></div></div>`;
    return;
  }
  if(state.configError){
    app.innerHTML = `<div class="login-screen"><div class="login-card"><h1>Errore di connessione</h1><p class="sub">Non riesco a collegarmi al database: ${esc(state.configError)}. Controlla la configurazione Firebase e le regole di Firestore.</p></div></div>`;
    return;
  }
  if(state.loading){ app.innerHTML = '<div class="login-screen"><span style="color:#fff;">Caricamento...</span></div>'; return; }
  if(!state.currentUser){
    app.innerHTML = renderLogin();
    attachLoginHandlers();
    return;
  }
  const me = currentUserObj();
  if(!me){ state.currentUser=null; render(); return; }
  if(me.role==='admin'){
    app.innerHTML = renderAdmin();
    attachTopbarHandlers();
    attachAdminHandlers();
  } else {
    app.innerHTML = renderUser();
    attachTopbarHandlers();
    attachUserHandlers();
  }
}

loadAll();
</script>
